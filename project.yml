name: ClubConnect
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.8
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.2"
settings:
  base:
    DEVELOPMENT_TEAM: AD6Q827Z79
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  ClubConnect:
    type: application
    platform: iOS
    dependencies:
      - package: supabase-swift
        product: Realtime
    sources:
      - path: ClubConnect
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redaboutayeb.clubconnect
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ClubConnectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClubConnectUITests
        type: syncedFolder
    dependencies:
      - target: ClubConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redaboutayeb.clubconnect.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClubConnect:
    build:
      targets:
        ClubConnect: all
    test:
      targets:
        - ClubConnectUITests
