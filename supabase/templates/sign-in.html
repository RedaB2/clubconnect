<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#fbf8f4;color:#291d19;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <main style="max-width:460px;margin:0 auto;padding:24px;background:#fff;border-radius:16px">
      <p style="margin:0;color:#80523f;font-weight:600">Club Connect</p>
      <h1 style="font-size:26px;line-height:1.25">Verify your email for Club Connect</h1>
      <p>Open this link on the iPhone or iPad where you requested it.</p>
      <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:10px 18px;border-radius:9px;background:#80523f;color:#fff;text-decoration:none;font-weight:600">Sign in to Club Connect</a></p>
      <p>You can also use the following code in the app.</p>
      <p style="font-size:27px;letter-spacing:4px"><strong>{{ .Token }}</strong></p>
      <p style="font-size:14px;color:#625b55">The link and code expire in 10 minutes. If you didn’t request them, you can ignore this email.</p>
    </main>
  </body>
</html>
