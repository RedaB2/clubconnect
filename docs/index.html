<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF8F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191513" media="(prefers-color-scheme: dark)">
  <title>Your invitation · Club Connect</title>
  <style>
    :root { color-scheme: light dark; --paper:#FBF8F4; --ink:#291D19; --muted:#66574f; --accent:#80523F; --button:#fff }
    @media(prefers-color-scheme:dark){:root{--paper:#211d19;--ink:#faf3e5;--muted:#d5c5b6;--accent:#efb193;--button:#261b16}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:1rem/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
    main{max-width:36rem;padding:2rem}
    header{font-weight:650;display:flex;align-items:center;gap:.65rem}header img{border-radius:12px;width:42px;height:42px}
    h1{font:500 clamp(2.7rem,8vw,4rem)/1.05 Georgia,serif;margin:2.5rem 0 1rem;letter-spacing:-.035em}
    p{color:var(--muted)}
    .open{display:inline-block;background:var(--accent);color:var(--button);border-radius:999px;padding:.8rem 1.3rem;text-decoration:none;font-weight:600;margin:.5rem 0 1.5rem}
    aside{border-top:1px solid var(--muted);padding-top:1rem}
    a{color:var(--accent)} a:focus-visible{outline:3px solid currentColor;outline-offset:4px}
  </style>
</head>
<body><main>
  <header><img src="./icon.png" alt="">Club Connect</header>
  <h1 id="title">Join a USC club</h1>
  <p id="detail">Open your invitation in Club Connect and verify your USC email to join.</p>
  <a class="open" id="open" href="clubconnect://join/menasa">Open in Club Connect</a>
  <aside><strong>Installing the pilot?</strong><p>Ask the club organizer for a TestFlight invitation. After accepting it, install Club Connect in TestFlight, then return to this link.</p></aside>
</main>
<script>
  const query = new URLSearchParams(location.search);
  const id = query.get('event');
  const uuid = /^[a-f\d]{8}(-[a-f\d]{4}){3}-[a-f\d]{12}$/i;
  const requested = query.get('club');
  const club = requested === 'menasa' || uuid.test(requested || '') ? requested.toLowerCase() : 'menasa';
  document.getElementById('open').href = 'clubconnect://join/' + club;
  if (club === 'menasa') document.getElementById('title').textContent = 'Join MENASA';
  if (query.get('alumni') === '1' && (requested === 'menasa' || uuid.test(requested || ''))) {
    document.getElementById('title').textContent = club === 'menasa' ? 'Join MENASA as an alum' : 'Your alumni invitation';
    document.getElementById('detail').textContent = 'Open Club Connect and verify the personal email address your organizer invited. Then add your name and graduation term to join the club.';
    document.getElementById('open').href = 'clubconnect://join/' + club + '?alumni=1';
  } else if (uuid.test(id || '')) {
    document.getElementById('title').textContent = 'Your event invitation';
    document.getElementById('detail').textContent = 'Open this club event to see the details and RSVP.';
    document.getElementById('open').href = 'clubconnect://event/' + id + '?club=' + club + (query.get('sample') === '1' ? '&sample=1' : '');
  }
</script></body>
</html>
